<rect x="866" y="212" width="212" height="34" rx="17" fill="none" stroke="#3B82F6" stroke-width="1.5"/><text x="884" y="234" fill="#93C5FD" textLength="164" lengthAdjust="spacing">Exploratory Prototype</text>
