<text class="m" x="48" y="266" font-size="12" fill="#1A1A1A" fill-opacity=".7" textLength="300" lengthAdjust="spacing">6 STUDIO PROJECTS · 2 RESEARCH WORKS</text>

<rect x="840" y="28" width="332" height="244" rx="20" fill="#1A1A1A"/>
<circle class="pulse" cx="868" cy="59" r="5" fill="#3B82F6"/>
<text class="m" x="882" y="64" font-size="12" fill="#FFD84D" textLength="150" lengthAdjust="spacing">FERNASLABS · R&amp;D</text>
<text class="h" x="866" y="116" font-size="34" fill="#ECECE8" textLength="160" lengthAdjust="spacingAndGlyphs">Research</text>
